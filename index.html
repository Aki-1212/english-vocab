<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Vocabulary</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <h1>English Vocabulary</h1>
    <p class="subtitle" id="subtitle">Vocabulary Trainer</p>
  </header>

  <section id="home" class="screen active">
    <div class="panel book-panel">
      <label for="bookSelect">教材</label>
      <select id="bookSelect">
        <option value="kikutan">キクタン</option>
        <option value="silver">銀フレ</option>
      </select>
    </div>
    <div class="panel history-panel">
      <h2>学習履歴</h2>
      <div id="historySummary">まだ学習履歴がありません。</div>
      <button id="resetHistory" class="text-btn">履歴をリセット</button>
    </div>
    <div class="panel">
      <h2>範囲を選ぶ</h2>
      <div class="range-grid" id="rangeGrid"></div>
    </div>
  </section>

  <section id="mode" class="screen">
    <button class="back-link" id="modeBack">← 範囲選択へ</button>
    <div class="panel">
      <h2 id="selectedRangeTitle">1–50</h2>
      <div class="mode-grid">
        <button class="choice-btn" data-mode="choice"><strong>4択モード</strong><span>4つの選択肢から答える</span></button>
        <button class="choice-btn" data-mode="card"><strong>カードモード</strong><span>答えを確認して進む</span></button>
        <button class="choice-btn" data-mode="learning"><strong>学習モード</strong><span>4択のあと、英語を入力する</span></button>
        <button class="choice-btn" data-mode="voice" id="voiceModeButton"><strong>音声モード</strong><span id="voiceModeDescription">4択のあと、英語を音声で答える</span></button>
        <button class="choice-btn" data-mode="sentence" id="sentenceModeButton"><strong>文章学習モード</strong><span id="sentenceModeDescription">英文の空欄に単語を入力する</span></button>
      </div>
    </div>
  </section>

  <section id="quiz" class="screen">
    <div class="quiz-top">
      <button class="back-link" id="quizBack">← やめる</button>
      <div class="quiz-progress">
        <div class="quiz-progress-label"><span id="progressTitle">進捗</span><span id="progress">1 / 50</span></div>
        <div class="progress-track" role="progressbar" aria-label="問題の進捗" aria-valuemin="0" aria-valuemax="50" aria-valuenow="1">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="learningStageProgress" class="learning-stage-progress hidden"></div>
        <div class="progress-counts">
          <span><strong id="knownCount">0</strong> 覚えている</span>
          <span><strong id="unknownCount">0</strong> 覚えていない</span>
        </div>
      </div>
    </div>
    <div id="wordPanel" class="panel word-panel">
      <button id="speakBtn" class="speak-btn" aria-label="発音を聞く">🔊 発音</button>
      <button id="hintBtn" class="hint-btn hidden" aria-label="英単語のヒントを表示">ヒント</button>
      <div class="word-number" id="wordNumber">No. 1</div>
      <div class="word" id="word">begin</div>
      <div id="sentencePrompt" class="sentence-prompt hidden"></div>
      <div id="sentenceTranslation" class="sentence-translation hidden"></div>
      <div id="feedback" class="feedback"></div>
      <div id="meaning" class="meaning hidden"></div>
    </div>
    <div id="choices" class="choices"></div>
    <button id="choiceDontKnow" class="secondary-btn choice-dont-know hidden">わからない</button>
    <div id="learningInput" class="learning-input hidden">
      <label for="englishAnswer">英単語を入力</label>
      <input id="englishAnswer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="learning-actions">
        <button id="submitEnglish" class="primary-btn">回答する</button>
        <button id="dontKnow" class="secondary-btn">わからない</button>
      </div>
    </div>
    <div id="voiceInput" class="learning-input voice-input hidden">
      <label>日本語の意味を見て、英単語を声に出してください</label>
      <div id="voiceRecognitionStatus" class="voice-recognition-status" aria-live="polite">マイクを押して回答</div>
      <button id="startVoiceAnswer" class="primary-btn" type="button">🎙 音声で回答</button>
      <button id="voiceDontKnow" class="secondary-btn" type="button">わからない</button>
    </div>
    <div id="sentenceInput" class="learning-input sentence-input hidden">
      <label for="sentenceAnswer">空欄に入る英単語を入力</label>
      <input id="sentenceAnswer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="submitSentenceAnswer" class="primary-btn">回答する</button>
    </div>
    <div id="cardActions" class="card-actions hidden">
      <button id="markUnknown" class="secondary-btn">← 覚えていない</button>
      <button id="markKnown" class="primary-btn">覚えている →</button>
      <button id="previousCard" class="secondary-btn">一つ戻る</button>
    </div>
  </section>

  <aside id="typingPractice" class="typing-practice hidden" aria-label="単語練習">
    <div id="typingPracticeHandle" class="typing-practice-header">
      <strong id="typingPracticeTitle">タイピング練習</strong>
    </div>
    <div class="typing-practice-body">
      <div id="typingPracticeEntry" class="typing-practice-entry">
        <div class="typing-input-field">
          <div id="typingPrompt" class="typing-prompt" aria-hidden="true"></div>
          <input id="typingPracticeInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="表示された英単語を入力">
        </div>
        <button id="typingSubmit" class="typing-submit" type="button" aria-label="入力を判定">✓</button>
      </div>
      <div id="voicePracticeEntry" class="voice-practice-entry hidden">
        <button id="voicePracticeButton" class="voice-practice-button" type="button">🎙 音声で練習</button>
      </div>
      <div id="typingStatus" class="typing-status" aria-live="polite"></div>
      <div id="voicePracticeStatus" class="typing-status hidden" aria-live="polite">マイクを押して単語を発音</div>
      <div id="typingHistory" class="typing-history" role="log" aria-label="練習結果"></div>
    </div>
  </aside>

  <section id="result" class="screen">
    <div class="panel result-panel">
      <div class="result-icon">✓</div>
      <h2>終了！</h2>
      <div id="score" class="score">0 / 0</div>
      <p id="scoreMessage"></p>
    </div>
    <div class="panel">
      <h2>覚えていない単語</h2>
      <div id="wrongList" class="wrong-list"></div>
      <p id="noWrong" class="empty hidden">覚えていない単語はありません。</p>
    </div>
    <div class="result-actions">
      <button id="retryWrong" class="primary-btn">覚えていない単語を復習</button>
      <button id="resultBack" class="secondary-btn">戻る</button>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
